name: publish
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: weminai/weminai.github.io
          path: src
      - name: build news site
        run: |
          mkdir -p _site
          cp -r src/news src/media src/data _site/
          for f in nocopy.js favicon.ico favicon.svg favicon_64.png apple-touch-icon.png logo.png; do [ -f "src/$f" ] && cp "src/$f" _site/; done
          cp src/news/index.html _site/index.html
          for f in src/news/*; do b=$(basename "$f"); [ -f "_site/$b" ] || cp "$f" "_site/$b"; done
          [ -f src/404.html ] && cp src/404.html _site/404.html
          touch _site/.nojekyll
          echo news.weminai.com > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
